<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Screensaver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&family=Figtree:wght@400;500;600&display=swap">
    <style>
        /* "Quiet Hours": neutral near-black, grey-white text, one accent, sized to read
           from across the room with light strokes. Everything is sized in --u, one design pixel
           of a 1280x800 layout: the 16:10 Galaxy Tab A9+ (1920x1200). */
        :root {
            --u: min(calc(100vw / 1280), calc(100vh / 800));
            /* Neutral blacks matching the HA dashboard's Caule Black themes
               (2026-10-07: the user rejected the warm brown tint; it read as
               brown, not charcoal). Not pure black, which glows navy on the LCD. */
            --bg: #0c0c0c;
            --text-hi: #f2f2f2;
            --text: #e5e5e5;
            --text-mid: #c8c8c8;
            --text-dim: #b4b4b4;
            --text-low: #9e9e9e;
            --tag-border: #3a3a3a;
            --accent: #5fc9b4;      /* follows the season (js/ambience.js) */
            --calm: #5fc9b4;        /* "all is well" tags: always teal, so they never read as amber */
            --accent-border: #2c5a51;
            --warn: #e0a64a;
            --warn-text: #f0bd68;
            --warn-border: #6b5122;
            --alert: #ff6b5e;
            --alert-text: #ff9384;
            --alert-border: #7a3128;
            --night-text: #9a9a9a;
            --night-low: #8c8c8c;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            cursor: none;
        }

        body {
            color: var(--text);
            font-family: 'Figtree', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #screen {
            position: relative;
            width: calc(var(--u) * 1280);
            height: calc(var(--u) * 800);
            box-sizing: border-box;
            padding: calc(var(--u) * 56) calc(var(--u) * 64) calc(var(--u) * 34);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            row-gap: calc(var(--u) * 16);
            transition: transform 4s ease-in-out;
        }

        /* Left: date, clock and weather. Right: the agenda. Both centered on
           the same line. text-box trims the clock and temperature lines to
           their letters (never the agenda rows: that clips their glyphs). */
        #top {
            align-self: center;
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            column-gap: calc(var(--u) * 72);
            align-items: center;
        }

        .date, .time, .period, .wx-temp {
            text-box: trim-both cap alphabetic;
        }

        /* ===== Left column: clock + weather ===== */
        /* Each column is a left-aligned block, and the block sits centered in
           its half of the screen rather than hugging the left edge. */
        #left, #side {
            justify-self: center;
            width: fit-content;
            max-width: 100%;
        }

        #left {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #clock {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 46);
        }

        #clock .date {
            font-size: calc(var(--u) * 38);
            font-weight: 400;
            letter-spacing: 0.01em;
            color: var(--text-dim);
        }

        #clock .face {
            display: flex;
            white-space: nowrap;
            align-items: flex-start;
            gap: calc(var(--u) * 14);
        }

        #clock .time {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: calc(var(--u) * 215);   /* "12:59 PM" still fits the column */
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text-hi);
            font-variant-numeric: tabular-nums;
        }

        #clock .period {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 36);
            line-height: 1;
            color: var(--text-low);
        }

        #weather {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 18);
            margin-top: calc(var(--u) * 48);
        }

        .wx-now {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 24);
        }

        .wx-icon svg {
            display: block;
            width: calc(var(--u) * 84);
            height: calc(var(--u) * 84);
            color: var(--accent);
        }

        .wx-temp {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 120);
            line-height: 1;
            color: var(--text-hi);
        }

        .wx-cond {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 6);
        }

        .wx-label {
            font-size: calc(var(--u) * 40);
            font-weight: 500;
            color: var(--text-hi);
        }

        .wx-hilo {
            font-size: calc(var(--u) * 32);
            font-weight: 400;
            color: var(--text-dim);
            white-space: pre;
        }

        .wx-next {
            font-size: calc(var(--u) * 28);
            color: var(--text-dim);
        }

        /* ===== Insights: a few quiet, rotating lines under the weather ===== */
        /* Two lines tall at all times, so the clock above never shifts as lines come and go.
           width 0 / min-width 100%: a long line must not widen #left, or the centered block
           (and the clock with it) slides left. Long lines run right; any that would reach the
           agenda are shrunk to fit (never cut off). */
        #insights {
            width: 0;
            min-width: 100%;
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 14);
            min-height: calc(var(--u) * 87);
            margin-top: calc(var(--u) * 30);
            padding-top: calc(var(--u) * 26);
            border-top: 1.5px solid #1f1f1f;
        }
        #insights:empty, body.night #insights { display: none; }
        .ins {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
            font-size: calc(var(--u) * 29);
            line-height: 1.25;
            color: var(--text-mid);
            white-space: nowrap;
            width: max-content;    /* measured by fitInsights() in screensaver.js */
        }
        /* The rotating lines, below any pinned ones. They scroll in and out
           (Insights.scroll): clip at this box's top and bottom only, so they pass behind
           the pinned lines and long lines still run right. */
        .ins-roll {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 14);
            /* Leaving lines get to slide into the gap under a pinned line (or, with
               none pinned, up to the rule) before they vanish, so they glide out. */
            clip-path: inset(calc(var(--u) * -14) -100vw 0 -100vw);
        }
        .ins-roll:first-child { clip-path: inset(calc(var(--u) * -26) -100vw 0 -100vw); }
        .ins.leaving { position: absolute; }
        .ins svg {
            width: calc(var(--u) * 32);
            height: calc(var(--u) * 32);
            flex: none;
            color: var(--text-low);
        }
        .ins b { font-weight: 500; color: var(--text-hi); }
        .ins.nudge { color: var(--warn-text); }
        .ins.nudge svg { color: var(--warn); }
        /* ===== Right column: agenda, each time above its event ===== */
        #side {
            min-width: 0;
        }

        .agenda-head {
            font-size: calc(var(--u) * 22);
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-low);
            margin-bottom: calc(var(--u) * 26);
        }

        #agenda {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 26);
        }

        .ev-when {
            font-size: calc(var(--u) * 27);
            font-weight: 400;
            line-height: 1.25;
            color: var(--text-dim);
        }

        .ev-name {
            font-size: calc(var(--u) * 42);
            font-weight: 400;
            line-height: 1.25;
            color: var(--text-hi);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ev-none {
            font-size: calc(var(--u) * 30);
            color: var(--text-low);
        }

        /* ===== Bottom row: status tags + timers ===== */
        /* Tags then timers, centered together; a second line when they don't
           fit on one (two timers beside two tags), never drawn over each other */
        #status {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: calc(var(--u) * 16) calc(var(--u) * 24);
            min-height: calc(var(--u) * 40);
        }

        #tags:empty, #timers:empty { display: none; }

        #tags {
            justify-content: center;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: calc(var(--u) * 12) calc(var(--u) * 40);
        }

        /* One quiet line of coloured dots and words, no pill outlines
           (2026-10-08: four pills wrapped to two rows and crowded the clock) */
        .tag {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 12);
            font-size: calc(var(--u) * 25);
            font-weight: 400;
            color: var(--text);
        }

        .tag .dot {
            width: calc(var(--u) * 9);
            height: calc(var(--u) * 9);
            border-radius: 50%;
            background: #6a665f;
        }

        .tag.calm { color: var(--calm); }
        .tag.calm .dot { background: var(--calm); }
        .tag.warn { color: var(--warn-text); }
        .tag.warn .dot { background: var(--warn); }
        .tag.alert { color: var(--alert-text); }
        .tag.alert .dot { background: var(--alert); }

        #timers {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
        }

        .timer {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 22);
            padding: calc(var(--u) * 12) calc(var(--u) * 24);
            border: 2px solid var(--accent-border);
            border-radius: calc(var(--u) * 20);
        }

        .timer-meta {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 10);
            width: calc(var(--u) * 210);
        }

        .timer-name {
            font-size: calc(var(--u) * 24);
            font-weight: 400;
            color: var(--text-mid);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-bar {
            height: calc(var(--u) * 6);
            border-radius: 3px;
            background: #262626;
            overflow: hidden;
        }

        .timer-bar > div {
            height: 100%;
            margin-left: auto;   /* shrinks toward the right edge */
            background: var(--accent);
            transition: width 1s linear;
        }

        .timer-time {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 68);
            line-height: 1;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .timer.ending { border-color: var(--alert-border); }
        .timer.ending .timer-time { color: var(--alert); }
        .timer.ending .timer-bar > div { background: var(--alert); }
        .timer.done .timer-time { animation: timerDone 1.6s ease-in-out infinite; }

        @keyframes timerDone {
            50% { opacity: 0.45; }
        }

        .timer-more {
            font-size: calc(var(--u) * 24);
            color: var(--text-low);
        }

        /* ===== Night: dim clock + temperature; tags and timers as by day ===== */
        /* In a dark room even #0c0c0c glows; night goes darker still */
        body.night { --bg: #050505; }

        #night-weather { display: none; }

        body.night #top {
            grid-template-columns: minmax(0, 1fr);
        }

        body.night #side,
        body.night #weather,
        body.night #clock .date {
            display: none;
        }

        body.night #left {
            align-items: center;
            gap: calc(var(--u) * 40);
        }

        body.night #insights.homeward {
            display: flex;
            align-items: center;
            width: auto;
            max-width: 100%;
            min-height: 0;
            margin-top: 0;
            padding-top: 0;
            border-top: 0;
        }
        body.night #insights .ins { color: var(--night-low); }
        body.night #insights .ins b { color: var(--night-text); }

        body.night #clock .time {
            font-size: calc(var(--u) * 260);
            color: var(--night-text);
        }

        body.night #clock .period {
            font-size: calc(var(--u) * 40);
            color: var(--night-low);
        }

        body.night #night-weather {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
            font-size: calc(var(--u) * 40);
            font-weight: 400;
            color: var(--night-low);
            white-space: pre;
        }

        body.night #night-weather svg {
            width: calc(var(--u) * 46);
            height: calc(var(--u) * 46);
        }
    </style>
<style>
/* Map traffic colours, fixed per season and set by the date alone (a little inline script at the end
   of the head picks the season; ?season= overrides it). Deliberately independent of js/ambience.js
   and HA, so the seasons keep working if other code changes or fails. Planes are near-white with
   a season hint, boats and trains two hues clearly apart from them and from each other (trains were
   picked by hand 2026-10-23: a formula put them 60° from the boats, which blurred together dimmed). */
:root,:root[data-season=fall]{--plane:#f3dac9;--boat:#7bb8e0;--train:#f3a4d2}
:root[data-season=winter]{--plane:#d2e4f6;--boat:#e0ad7b;--train:#7fdc8f}
:root[data-season=spring]{--plane:#d9eed2;--boat:#c67be0;--train:#f0957a}
:root[data-season=summer]{--plane:#c7ece5;--boat:#e07b8f;--train:#8f9ff2}
#screen{isolation:isolate}#road-map,#flight-map{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
/* Traffic sits above the edge fade (#screen::before, z-index -1, earlier in the DOM), so a train near
   Roosevelt or a plane at the edge stays full strength; only the streets fade out (2026-10-23). */
#flight-map{z-index:-1}
/* Streets sit back (--map-opacity, ?map=); planes, boats, trains and their labels stay readable above them. */
/* Streets have their own SVG, dimmed as a whole: an opacity on the masked street group inside one SVG did not render on the tablet. */
#road-map{opacity:var(--map-opacity,.52)}#flight-map .flights,#flight-map .vessels,#flight-map .trains{opacity:var(--traffic-opacity,.55)}
#screen::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--bg),transparent 25%),linear-gradient(to bottom,var(--bg),transparent 18%),linear-gradient(to right,var(--bg),transparent 15%),linear-gradient(to left,var(--bg),transparent 15%);pointer-events:none}
.live-aircraft use{fill:var(--plane,#d9f2ec)}.live-aircraft text,.live-vessel text,.live-train text,.home text{font:14px Figtree,sans-serif;letter-spacing:1.4px;fill:var(--map-label,#d2d6d8);paint-order:stroke;stroke:var(--bg,#0c0c0c);stroke-width:3px;stroke-linejoin:round}.live-aircraft .flight-route,.live-vessel .vessel-detail,.live-train .train-detail{font-size:11px;letter-spacing:1px;fill:var(--map-route,#9ba2a6);opacity:1}.home{opacity:.6}
.live-vessel use{fill:var(--boat,#78c0e6)}.vessel-trail{stroke:var(--boat,#78c0e6);stroke-width:1.6;stroke-opacity:.45;stroke-linejoin:round}.live-vessel.docked{opacity:.55}.live-vessel.docked .vessel-detail{display:none}
/* Trains: Amtrak and Sounder a locomotive with a two-line label, Link its own locomotive + car with the line only. */
.live-train use{fill:var(--train,#f3a4d2)}
/* A marker whose label would sit on the clock, weather or agenda keeps a dimmed icon only. Trains keep
   theirs at full strength: Link runs along I-5, right behind the clock and weather, so dimmed it vanished. */
.under-text text{display:none}.name-only .flight-route,.name-only .vessel-detail,.name-only .train-detail{display:none}.under-text .live-marker,.under-text .vessel-marker{opacity:.45}.home text{font-size:13px;font-weight:500;fill:var(--plane,#a8d9cb)}.live-marker{transition:transform 12s steps(12,end)}
body.night #road-map,body.force-night #road-map{opacity:calc(var(--map-opacity,.52)*.85)}body.night,body.force-night{--traffic-opacity:.3}body.night #screen::before,body.force-night #screen::before{background:linear-gradient(to top,var(--bg),transparent 25%),linear-gradient(to bottom,var(--bg),transparent 18%),linear-gradient(to right,var(--bg),transparent 15%),linear-gradient(to left,var(--bg),transparent 15%)}
body.no-labels .live-aircraft text,body.no-labels .live-vessel text,body.no-labels .live-train text{display:none}#map-credit{position:absolute;bottom:8px;right:14px;z-index:1;font:10px Figtree,sans-serif;color:#666;opacity:.7;pointer-events:none}#map-credit a{color:inherit;text-decoration:none}body.night #map-credit,body.force-night #map-credit{opacity:.4}
@media(prefers-reduced-motion:reduce){.live-marker{transition:none}}
#flight-tally{position:absolute;left:calc(var(--u)*64);bottom:calc(var(--u)*12);font-size:calc(var(--u)*14);font-weight:400;letter-spacing:calc(var(--u)*.6);color:#a0a0a0;opacity:.8;pointer-events:none;font-variant-numeric:tabular-nums}
body.night #flight-tally,body.force-night #flight-tally{opacity:.5}
/* Separate the temperature degree glyph from the geographic HOME marker. */
body.night #night-weather,body.force-night #night-weather{transform:translateY(calc(var(--u)*44))}
/* Ambience (js/ambience.js): season accent, golden hour, weather mood, sun/moon arc */
.live-aircraft .trail{stroke:var(--plane,#d9f2ec)}.home .home-symbol{fill:var(--accent);stroke:none}
#local-roads .road{transition:stroke 60s steps(60,end)}#local-roads .minor{stroke:var(--road-minor,#343b38)}#local-roads .major{stroke:var(--road-major,#56605c)}#local-roads .water{stroke:var(--road-water,#495b57)}#local-roads .rail,#local-roads .light_rail{stroke:var(--road-rail,#7a6f63)}
/* Layer switches (js/map-layers.js: one HA "Wall map ..." input_boolean each; off = hide-* on body). */
body.hide-planes #flight-map .flights,body.hide-boats #flight-map .vessels,body.hide-trains #flight-map .trains,
body.hide-streets #local-roads .minor,body.hide-streets #local-roads .major,body.hide-tracks #local-roads .rail,
body.hide-tracks #local-roads .light_rail,body.hide-lakes #local-roads .water,body.hide-lakes #local-roads .water-label,
body.hide-rivers #local-roads .river,body.hide-trails #local-roads .trail,body.hide-neighborhoods #local-roads .place-label,
body.hide-sky #sky{display:none}
body.hide-labels .live-aircraft text,body.hide-labels .live-vessel text,body.hide-labels .live-train text{display:none}
/* Faint place and lake names, drawn with the streets (so under the map dimming and the edge fade). */
#local-roads .map-label{font-family:Figtree,sans-serif;font-weight:500;letter-spacing:1.6px;fill:var(--map-label,#d2d6d8);opacity:.5}
#local-roads .place-label{text-transform:uppercase}#local-roads .rank-1{font-size:13px}#local-roads .rank-2{font-size:11px}
#local-roads .rank-3{font-size:9.5px;opacity:.4}#local-roads .water-label{font-style:italic;letter-spacing:1px;fill:#86a8a2}
#local-roads .coast,#local-roads .river{stroke:var(--road-water,#495b57)}#local-roads .trail{stroke:var(--road-trail,#5f7356)}

#mood{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
#road-map{transition:opacity 4s}#local-roads{transition:filter 4s}/* Fog is a hint only: a stronger blur smears the sub-pixel street lines to nothing (seen 2026-10-15). */
body.mood-fog #road-map{opacity:calc(var(--map-opacity,.52)*.85)}body.mood-fog #local-roads{filter:blur(.5px)}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.7;transition:opacity 4s}body.night #sky,body.force-night #sky{opacity:.35}
#sky .arc-track{fill:none;stroke:#8a8a8a;stroke-opacity:.22;stroke-width:1.2;stroke-dasharray:2 7;stroke-linecap:round}
#sky .arc-done{fill:none;stroke:var(--accent);stroke-opacity:.35;stroke-width:1.4}
#sky .arc-time{font:13px Figtree,sans-serif;letter-spacing:1px;fill:#8a8a8a;opacity:.7}
#sky .moon-dark{fill:#1c1c1c;stroke:#5a5a5a;stroke-width:.8}#sky .moon-lit{fill:#d8d8d8}
body.celebrate #clock .time{color:var(--celebrate);transition:color 4s}
.ins.celebrate{color:var(--text-hi)}.ins.celebrate svg,.ins.first svg{color:var(--accent)}
.ins.first.fresh svg{animation:firstGlow 3s ease-out both}@keyframes firstGlow{0%{transform:scale(.6);opacity:0}40%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}

<script>
// Season for the map traffic colours (CSS above). Meteorological seasons, like js/ambience.js;
// re-checked hourly because the page runs for days. Needs nothing else on the page.
(function () {
    var of = ['winter', 'winter', 'spring', 'spring', 'spring', 'summer', 'summer', 'summer', 'fall', 'fall', 'fall', 'winter'];

<script type="module">
import { config } from './js/config.js?v=20261009-flight-8';
import { startScreensaver } from './js/screensaver.js?v=49';
import { FlightBackdrop } from './js/flight-backdrop.js?v=32';
import { VesselLayer, VESSEL_ENTITY } from './js/vessel-layer.js?v=13';
import { TrainLayer, TRAIN_ENTITY } from './js/train-layer.js?v=5';
import { startMapLayers } from './js/map-layers.js?v=1';
import { Ambience } from './js/ambience.js?v=14';
// Display settings are configured by URL; the screensaver stays touchless.
const params=new URLSearchParams(location.search);
const brightness=Number(params.get('map'));
if(params.has('map') && Number.isFinite(brightness))document.documentElement.style.setProperty('--map-opacity',Math.min(100,Math.max(0,brightness))/100);
if(params.has('night'))document.body.classList.add('force-night');
if(params.get('labels')==='0')document.body.classList.add('no-labels');
startMapLayers(config);
const ambience=new Ambience(config).start();
startScreensaver(config,{extraLines:now=>ambience.lines(now)});
const flightMap=document.querySelector('#flight-map');
const backdrop=new FlightBackdrop(config,flightMap,null,document.querySelector('#flight-tally'),
    {layer:new VesselLayer(flightMap.querySelector('.vessels')),entity:VESSEL_ENTITY},
    {layer:new TrainLayer(flightMap.querySelector('.trains')),entity:TRAIN_ENTITY});
window.flightBackdrop=backdrop;
backdrop.start();
</script></body>
