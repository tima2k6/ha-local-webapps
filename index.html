<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Screensaver</title>
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            /* Colors */
            --color-background: #000000;
            --color-text: #ffffff;
            --color-current: #00ffd0;
            --color-forecast: #16F529;
            
            /* Font Sizes */
            --font-size-xl: min(10vw, 6rem);      /* Time display */
            --font-size-lg: min(5vw, 3.5rem);     /* Headers, event names */
            --font-size-md: min(4.5vw, 3rem);     /* Date display */
            --font-size-sm: min(3vw, 1.5rem);     /* Details, temps, dates */
            
            /* Shadows */
            --shadow-strong: 
                2px 2px 0 #333,
                3px 3px 0 #222,
                4px 4px 0 #111;
            --shadow-light: 
                1px 1px 0 #333,
                2px 2px 0 #222,
                3px 3px 0 #111;
                
            /* Spacing */
            --spacing-xs: 0.5vh;
            --spacing-sm: 1vh;
            --spacing-md: 2vh;
            --spacing-lg: 3vh;
        }

        /* ===== FONT FACES ===== */
        @font-face {
            font-family: 'Protest Strike';
            src: url('/fonts/ProtestStrike-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Zain';
            src: url('/fonts/Zain-Light.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Zain';
            src: url('/fonts/Zain-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Zain';
            src: url('/fonts/Zain-Extrabold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        /* ===== BASE STYLES ===== */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--color-background);
            color: var(--color-text);
            font-family: 'Protest Strike', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        #container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8vh 0;
            overflow: hidden;
        }

        /* ===== TIME & DATE SECTION ===== */
        #time-date-section {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            margin-bottom: var(--spacing-sm);
        }

        #time-display {
            font-size: var(--font-size-xl);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin: 0;
            color: var(--color-text);
            text-shadow: var(--shadow-strong);
            -webkit-text-stroke: 1px rgba(0,0,0,0.4);
        }

        #date-display {
            font-size: var(--font-size-md);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin: 0;
            color: var(--color-text);
            text-shadow: var(--shadow-strong);
            -webkit-text-stroke: 0.5px rgba(0,0,0,0.3);
        }

        #info-section {
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            gap: 2vh;
        }

        #weather-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0 1vh;
            padding: 0 1vw;
            max-width: 50%;
            position: relative;
            min-height: 200px;
        }

        #weather-display img {
            width: min(100px, 15vw);
            height: min(100px, 15vw);
            
            filter: drop-shadow(2px 2px 0 #333);
        }

        #calendar-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0 1vh;
            padding: 0 2vw;
            max-width: 50%;
        }

        /* Calendar elements */
        #calendar-events {
            position: relative;
            min-height: 120px;
            width: 100%;
        }

        .event {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 3s ease-in-out, transform 3s ease-in-out;
            width: 100%;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.3rem 0;
            box-sizing: border-box;
        }

        .event.active {
            opacity: 1;
            transform: translateY(0);
            z-index: 2;
        }

        .event.hidden {
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            z-index: 1;
        }

        .event-name {
            margin-bottom: 0.5rem;
            font-family: 'Zain', sans-serif;
        }

        .event-datetime {
            color: #ffffff;
            font-style: italic;
            font-family: 'Zain', sans-serif;
        }

        /* Ticker styles */
        #sensor-ticker {
            height: min(3em, 10vh);
            line-height: min(3em, 10vh);
            
            overflow: hidden;
            white-space: nowrap;
            font-size: min(4vw, 3rem);
            color: white;
            position: relative;
            width: 100%;
            font-family: 'Zain', sans-serif;
            font-weight: 800;
        }

        #sensor-ticker .ticker-content {
            display: inline-flex;
            position: absolute;
            white-space: nowrap;
            will-change: transform;
            left: 0;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        #sensor-ticker .ticker-text {
            display: inline-block;
            padding: 0 2rem;
        }

        @keyframes tickerScroll {
            0% {
                transform: translate3d(100vw, 0, 0);
            }
            100% {
                transform: translate3d(-100%, 0, 0);
            }
        }

        #weather-display .weather-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1rem;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 0 2rem;
        }

        #weather-display .weather-info {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
        }

        #weather-display .temp {
            font-size: min(3vw, 1.5rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
        }

        #weather-display .details {
            font-size: min(3vw, 1.5rem);
            
        }

        #weather-display .feels-like {
            font-size: min(3vw, 1.5rem);
        
        }

        .zain-bold {
            font-family: 'Zain', sans-serif !important;
            font-weight: bold !important;
        }

        #weather-display .weather-column > div:first-child {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            order: 1;
        }

        #weather-display .weather-column img {
            order: 2;
        }

        #weather-display .weather-info {
            order: 3;
        }

        /* Update the columns layout */
        .weather-columns {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding: 0 2vw;
            box-sizing: border-box;
        }

        .weather-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3vh;
        }

       
        .current-section, .forecast-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
        }

        .currently-header, .forecast-header {
            font-family: 'Zain', sans-serif;
            font-size: var(--font-size-lg);
            margin: 0;
            padding: 0;
            margin-bottom: var(--spacing-xs);
            color: var(--color-text);
            text-shadow: var(--shadow-strong);
            -webkit-text-stroke: 1px rgba(0,0,0,0.3);
            order: 1;
        }

        .current-weather-info {
            text-align: center;
        }

        .current-weather-icon {
            width: min(100px, 15vw);
            height: min(100px, 15vw);
            filter: drop-shadow(2px 2px 0 #333);
            order: 2;
        }

        /* Forecast Section */
        

        .forecast-weather-info {
            text-align: center;
        }

        /* Everything else stays Bold */
        #weather-display, 
        #calendar-events,
        #sensor-ticker,
        .event-name,
        .event-datetime,
        .event,
        #calendar-events .event {
            font-family: 'Zain', sans-serif;
            font-weight: bold;
        }

        .weather-column > * {
            width: 100%;
            text-align: center;
        }

        .currently-header {
            order: 1;
        }

        .current-weather-info {
            order: 2;
        }

        .current-weather-icon {
            order: 3;
            width: min(100px, 15vw);
            height: min(100px, 15vw);
        }

        .forecast-header {
            order: 4;
        }

        .forecast-weather-info {
            order: 5;
        }


        /* Weather and calendar content */
        .current-weather-info, .forecast-weather-info {
            text-align: center;
            width: 100%;
        }

        /* Headers with depth */
        #calendar-header {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            font-size: var(--font-size-lg);
            margin: 0;
            padding: 0;
            margin-bottom: var(--spacing-xs);
            color: var(--color-text);
            text-shadow: var(--shadow-strong);
            -webkit-text-stroke: 1px rgba(0,0,0,0.3);
        }

        /* Large text with strong depth - event name */
        .event-name {
            font-size: var(--font-size-lg);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: var(--spacing-xs);
            color: var(--color-text);
            text-shadow: var(--shadow-strong);
            -webkit-text-stroke: 1px rgba(0,0,0,0.4);
        }
        
        /* Smaller text with strong depth - temperature */
        .current-weather-info .temp {
            font-size: var(--font-size-sm);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: var(--spacing-xs);
            color: var(--color-text);
            text-shadow: var(--shadow-strong);
            -webkit-text-stroke: 1px rgba(0,0,0,0.4);
        }

        /* Calendar events with subtle depth */
        #calendar-events {
            font-size: var(--font-size-lg);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: var(--spacing-xs);
            color: var(--color-text);
            text-shadow: var(--shadow-light);
            -webkit-text-stroke: 0.5px rgba(0,0,0,0.3);
        }
        
        /* Smaller text with subtle depth for tablet display */
        .current-weather-info .details,
        .current-weather-info .feels-like,
        .forecast-weather-info .details,
        .forecast-weather-info .temp,
        .event-datetime {
            font-size: var(--font-size-sm);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: var(--spacing-xs);
            color: var(--color-text);
            text-shadow: var(--shadow-light);
            -webkit-text-stroke: 0.5px rgba(0,0,0,0.3);
        }

        /* Event spacing */
        .event {
            margin-bottom: 1vh;
        }

        /* Ensure all text containers are fully opaque */
        .current-weather-info,
        .forecast-weather-info,
        #calendar-events,
        .event {
            opacity: 1;
        }

        /* Layout for temperature elements */
        .temp-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        /* Weather transition styles */
        .weather-section {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 3s ease-in-out, transform 3s ease-in-out;
            width: 100%;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.3rem 0;
            box-sizing: border-box;
            
        }

        .weather-section.active {
            opacity: 1;
            transform: translateY(0);
            z-index: 2;
        }

        .weather-section.hidden {
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            z-index: 1;
        }

        /* Weather headers */
        .weather-header {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            font-size: var(--font-size-lg);
            margin: 0;
            padding: 0;
            margin-bottom: var(--spacing-xs);
            color: var(--color-text);
            text-shadow: var(--shadow-strong);
            -webkit-text-stroke: 1px rgba(0,0,0,0.3);
        }

        .currently-header, .forecast-header {
            text-decoration: none;
            
            margin: 0;
            padding: 0;
            order: 1;
        }

        .currently-header {
            color: var(--color-current);
        }

        .forecast-header {
            color: var(--color-forecast);
        }

        /* Weather content */
        .weather-content {
            position: relative;
            min-height: 200px;
            width: 100%;
            margin-top: 0.5vh;
        }

        .current-weather-info, .forecast-weather-info {
            width: 100%;
            text-align: center;
            order: 3;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="time-date-section">
            <div id="date-display"></div>
            <div id="time-display"></div>
        </div>
        <div id="info-section">
            <div id="weather-display">Loading weather...</div>
            <div id="calendar-display">
                <div id="calendar-header">Upcoming Events</div>
                <div id="calendar-events"></div>
            </div>
        </div>
    </div>
    <div id="sensor-ticker"><div class="ticker-content"></div></div>

    <script type="module">
        import { config } from './js/config.js';
        import { WeatherDisplay } from './js/weather.js';
        import { CalendarDisplay } from './js/calendar.js';
        import { Clock } from './js/clock.js';
        import { Ticker } from './js/ticker.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize clock
            const clock = new Clock(
                document.getElementById('time-display'),
                document.getElementById('date-display')
            );
            clock.start();

            // Initialize weather
            const weatherDisplay = new WeatherDisplay(
                config.weatherApiKey, 
                document.getElementById('weather-display')
            );
            weatherDisplay.start();

            // Initialize calendar
            const calendarDisplay = new CalendarDisplay(
                config.haUrl,
                config.longLivedAccessToken,
                document.getElementById('calendar-events')
            );
            calendarDisplay.start();

            // Initialize ticker
            const ticker = new Ticker(
                config.haUrl,
                config.longLivedAccessToken,
                document.getElementById('sensor-ticker')
            );
            ticker.start();
        });
    </script>
</body>
</html>
