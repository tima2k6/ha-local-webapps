<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Screensaver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&family=Figtree:wght@400;500;600&display=swap">
    <style>
        /* "Quiet Hours": neutral near-black, grey-white text, one accent, sized to read
           from across the room with light strokes. Everything is sized in --u, one design pixel
           of a 1280x800 layout: the 16:10 Galaxy Tab A9+ (1920x1200). */
        :root {
            --u: min(calc(100vw / 1280), calc(100vh / 800));
            /* Neutral blacks matching the HA dashboard's Caule Black themes
               (2026-10-07: the user rejected the warm brown tint; it read as
               brown, not charcoal). Not pure black, which glows navy on the LCD. */
            --bg: #0c0c0c;
            --text-hi: #f2f2f2;
            --text: #e5e5e5;
            --text-mid: #c8c8c8;
            --text-dim: #b4b4b4;
            --text-low: #9e9e9e;
            --tag-border: #3a3a3a;
            --accent: #5fc9b4;
            --accent-border: #2c5a51;
            --warn: #e0a64a;
            --warn-text: #f0bd68;
            --warn-border: #6b5122;
            --alert: #ff6b5e;
            --alert-text: #ff9384;
            --alert-border: #7a3128;
            --night-text: #9a9a9a;
            --night-low: #8c8c8c;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            cursor: none;
        }

        body {
            color: var(--text);
            font-family: 'Figtree', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #screen {
            position: relative;
            width: calc(var(--u) * 1280);
            height: calc(var(--u) * 800);
            box-sizing: border-box;
            padding: calc(var(--u) * 56) calc(var(--u) * 64) calc(var(--u) * 44);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            row-gap: calc(var(--u) * 32);
            transition: transform 4s ease-in-out;
        }

        /* Left: date, clock and weather. Right: the agenda. Both centered on
           the same line. text-box trims the clock and temperature lines to
           their letters (never the agenda rows: that clips their glyphs). */
        #top {
            align-self: center;
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            column-gap: calc(var(--u) * 72);
            align-items: center;
        }

        .date, .time, .period, .wx-temp {
            text-box: trim-both cap alphabetic;
        }

        /* ===== Left column: clock + weather ===== */
        /* Each column is a left-aligned block, and the block sits centered in
           its half of the screen rather than hugging the left edge. */
        #left, #side {
            justify-self: center;
            width: fit-content;
            max-width: 100%;
        }

        #left {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #clock {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 46);
        }

        #clock .date {
            font-size: calc(var(--u) * 38);
            font-weight: 400;
            letter-spacing: 0.01em;
            color: var(--text-dim);
        }

        #clock .face {
            display: flex;
            white-space: nowrap;
            align-items: flex-start;
            gap: calc(var(--u) * 14);
        }

        #clock .time {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: calc(var(--u) * 215);   /* "12:59 PM" still fits the column */
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text-hi);
            font-variant-numeric: tabular-nums;
        }

        #clock .period {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 36);
            line-height: 1;
            color: var(--text-low);
        }

        #weather {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 18);
            margin-top: calc(var(--u) * 48);
        }

        .wx-now {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 24);
        }

        .wx-icon svg {
            display: block;
            width: calc(var(--u) * 84);
            height: calc(var(--u) * 84);
            color: var(--accent);
        }

        .wx-temp {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 120);
            line-height: 1;
            color: var(--text-hi);
        }

        .wx-cond {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 6);
        }

        .wx-label {
            font-size: calc(var(--u) * 40);
            font-weight: 500;
            color: var(--text-hi);
        }

        .wx-hilo {
            font-size: calc(var(--u) * 32);
            font-weight: 400;
            color: var(--text-dim);
            white-space: pre;
        }

        .wx-next {
            font-size: calc(var(--u) * 28);
            color: var(--text-dim);
        }

        /* ===== Right column: agenda, each time above its event ===== */
        #side {
            min-width: 0;
        }

        .agenda-head {
            font-size: calc(var(--u) * 22);
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-low);
            margin-bottom: calc(var(--u) * 26);
        }

        #agenda {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 26);
        }

        .ev-when {
            font-size: calc(var(--u) * 27);
            font-weight: 400;
            line-height: 1.25;
            color: var(--text-dim);
        }

        .ev-name {
            font-size: calc(var(--u) * 42);
            font-weight: 400;
            line-height: 1.25;
            color: var(--text-hi);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ev-none {
            font-size: calc(var(--u) * 30);
            color: var(--text-low);
        }

        /* ===== Bottom row: status tags + timers ===== */
        /* Tags then timers, centered together; a second line when they don't
           fit on one (two timers beside two tags), never drawn over each other */
        #status {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: calc(var(--u) * 16) calc(var(--u) * 24);
            min-height: calc(var(--u) * 90);
        }

        #tags:empty, #timers:empty { display: none; }

        #tags {
            justify-content: center;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: calc(var(--u) * 16);
        }

        .tag {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 12);
            padding: calc(var(--u) * 14) calc(var(--u) * 30);
            border: 1.5px solid var(--tag-border);
            border-radius: 999px;
            font-size: calc(var(--u) * 30);
            font-weight: 500;
            color: var(--text);
        }

        .tag .dot {
            width: calc(var(--u) * 13);
            height: calc(var(--u) * 13);
            border-radius: 50%;
            background: #6a665f;
        }

        .tag.calm { border-color: var(--accent-border); color: var(--accent); }
        .tag.calm .dot { background: var(--accent); }
        .tag.warn { border-color: var(--warn-border); color: var(--warn-text); }
        .tag.warn .dot { background: var(--warn); }
        .tag.alert { border-color: var(--alert-border); color: var(--alert-text); }
        .tag.alert .dot { background: var(--alert); }

        #timers {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
        }

        .timer {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 22);
            padding: calc(var(--u) * 12) calc(var(--u) * 24);
            border: 2px solid var(--accent-border);
            border-radius: calc(var(--u) * 20);
        }

        .timer-meta {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 10);
            width: calc(var(--u) * 210);
        }

        .timer-name {
            font-size: calc(var(--u) * 24);
            font-weight: 400;
            color: var(--text-mid);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-bar {
            height: calc(var(--u) * 6);
            border-radius: 3px;
            background: #262626;
            overflow: hidden;
        }

        .timer-bar > div {
            height: 100%;
            margin-left: auto;   /* shrinks toward the right edge */
            background: var(--accent);
            transition: width 1s linear;
        }

        .timer-time {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 68);
            line-height: 1;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .timer.ending { border-color: var(--alert-border); }
        .timer.ending .timer-time { color: var(--alert); }
        .timer.ending .timer-bar > div { background: var(--alert); }
        .timer.done .timer-time { animation: timerDone 1.6s ease-in-out infinite; }

        @keyframes timerDone {
            50% { opacity: 0.45; }
        }

        .timer-more {
            font-size: calc(var(--u) * 24);
            color: var(--text-low);
        }

        /* ===== Night: dim clock + temperature; tags and timers as by day ===== */
        /* In a dark room even #0c0c0c glows; night goes darker still */
        body.night { --bg: #050505; }

        #night-weather { display: none; }

        body.night #top {
            grid-template-columns: minmax(0, 1fr);
        }

        body.night #side,
        body.night #weather,
        body.night #clock .date {
            display: none;
        }

        body.night #left {
            align-items: center;
            gap: calc(var(--u) * 40);
        }

        body.night #clock .time {
            font-size: calc(var(--u) * 260);
            color: var(--night-text);
        }

        body.night #clock .period {
            font-size: calc(var(--u) * 40);
            color: var(--night-low);
        }

        body.night #night-weather {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
            font-size: calc(var(--u) * 40);
            font-weight: 400;
            color: var(--night-low);
            white-space: pre;
        }

        body.night #night-weather svg {
            width: calc(var(--u) * 46);
            height: calc(var(--u) * 46);
        }
    </style>
</head>
<body>
    <div id="screen">
        <div id="top">
            <div id="left">
                <div id="clock">
                    <div class="date"></div>
                    <div class="face">
                        <div class="time"></div>
                        <div class="period"></div>
                    </div>
                </div>
                <div id="weather"></div>
                <div id="night-weather"></div>
            </div>
            <div id="side">
                <div class="agenda-head">Next up</div>
                <div id="agenda"></div>
            </div>
        </div>
        <div id="status">
            <div id="tags"></div>
            <div id="timers"></div>
        </div>
    </div>

    <script src="js/ha-config.js?v=20261005"></script>
    <script type="module">
        import { config } from './js/config.js?v=20261005';
        import { startScreensaver } from './js/screensaver.js?v=9';

        document.addEventListener('DOMContentLoaded', () => startScreensaver(config));
    </script>
</body>
</html>
