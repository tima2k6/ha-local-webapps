<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Screensaver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&family=Figtree:wght@400;500;600&display=swap">
    <style>
        /* "Quiet Hours": pure black for the OLED, warm grey text, one accent.
           Everything is sized in --u, one design pixel of a 1280x720 layout,
           so the screen scales to any 16:9 display. */
        :root {
            --u: min(calc(100vw / 1280), calc(100vh / 720));
            --bg: #000000;
            --text-hi: #e6e2da;
            --text: #d9d6cf;
            --text-mid: #a9a59e;
            --text-dim: #8b8780;
            --text-low: #7d7a74;
            --rule: #1f1f1f;
            --tag-border: #262626;
            --accent: #5fc9b4;
            --warn: #e0a64a;
            --warn-text: #e8b25c;
            --warn-border: #4d3a1a;
            --alert: #ff6b5e;
            --alert-text: #ff8a7a;
            --alert-border: #5a2620;
            --night-text: #7a766f;
            --night-low: #6f6b65;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            cursor: none;
        }

        body {
            color: var(--text);
            font-family: 'Figtree', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #screen {
            position: relative;
            width: calc(var(--u) * 1280);
            height: calc(var(--u) * 720);
            box-sizing: border-box;
            padding: calc(var(--u) * 56) calc(var(--u) * 72) calc(var(--u) * 48);
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            column-gap: calc(var(--u) * 80);
            row-gap: calc(var(--u) * 32);
            transition: transform 4s ease-in-out;
        }

        /* ===== Clock ===== */
        #clock {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: calc(var(--u) * 8);
        }

        #clock .date {
            font-size: calc(var(--u) * 26);
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--text-dim);
        }

        #clock .face {
            display: flex;
            align-items: flex-start;
            gap: calc(var(--u) * 14);
        }

        #clock .time {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: calc(var(--u) * 250);
            line-height: 0.92;
            letter-spacing: -0.04em;
            color: var(--text-hi);
            font-variant-numeric: tabular-nums;
        }

        #clock .period {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 34);
            color: var(--text-low);
            margin-top: calc(var(--u) * 30);
        }

        /* ===== Right column: weather + agenda ===== */
        #side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: calc(var(--u) * 36);
            min-width: 0;
        }

        #weather {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 14);
        }

        .wx-now {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 22);
        }

        .wx-icon svg {
            display: block;
            width: calc(var(--u) * 64);
            height: calc(var(--u) * 64);
            color: var(--accent);
        }

        .wx-temp {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 96);
            line-height: 1;
            color: var(--text-hi);
        }

        .wx-cond {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 6);
        }

        .wx-label {
            font-size: calc(var(--u) * 28);
            font-weight: 500;
        }

        .wx-hilo {
            font-size: calc(var(--u) * 22);
            color: var(--text-dim);
            white-space: pre;
        }

        .wx-next {
            font-size: calc(var(--u) * 20);
            color: var(--text-low);
        }

        .rule {
            height: 1px;
            background: var(--rule);
        }

        .agenda-head {
            font-size: calc(var(--u) * 15);
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-low);
            margin-bottom: calc(var(--u) * 18);
        }

        #agenda {
            display: grid;
            grid-template-columns: calc(var(--u) * 150) minmax(0, 1fr);
            row-gap: calc(var(--u) * 16);
            column-gap: calc(var(--u) * 20);
            align-items: baseline;
        }

        .ev-when {
            font-size: calc(var(--u) * 19);
            color: var(--text-dim);
        }

        .ev-name {
            font-size: calc(var(--u) * 26);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ev-none {
            grid-column: 1 / -1;
            font-size: calc(var(--u) * 22);
            color: var(--text-low);
        }

        /* ===== Bottom row: status tags + timers ===== */
        #status {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: calc(var(--u) * 24);
            min-height: calc(var(--u) * 76);
        }

        #tags {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: calc(var(--u) * 14);
        }

        .tag {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 10);
            padding: calc(var(--u) * 10) calc(var(--u) * 18);
            border: 1px solid var(--tag-border);
            border-radius: 999px;
            font-size: calc(var(--u) * 18);
            color: var(--text-mid);
        }

        .tag .dot {
            width: calc(var(--u) * 8);
            height: calc(var(--u) * 8);
            border-radius: 50%;
            background: #4a4844;
        }

        .tag.calm .dot { background: var(--accent); }
        .tag.warn { border-color: var(--warn-border); color: var(--warn-text); font-weight: 500; }
        .tag.warn .dot { background: var(--warn); }
        .tag.alert { border-color: var(--alert-border); color: var(--alert-text); font-weight: 500; }
        .tag.alert .dot { background: var(--alert); }

        #timers {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 14);
        }

        .timer {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 20);
            padding: calc(var(--u) * 12) calc(var(--u) * 22);
            border: 1px solid #23403b;
            border-radius: calc(var(--u) * 18);
        }

        .timer-meta {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 8);
            min-width: calc(var(--u) * 170);
        }

        .timer-name {
            font-size: calc(var(--u) * 17);
            color: var(--text-mid);
        }

        .timer-bar {
            height: calc(var(--u) * 4);
            border-radius: 2px;
            background: #1c1c1c;
            overflow: hidden;
        }

        .timer-bar > div {
            height: 100%;
            margin-left: auto;   /* shrinks toward the right edge */
            background: var(--accent);
            transition: width 1s linear;
        }

        .timer-time {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 52);
            line-height: 1;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .timer.ending { border-color: var(--alert-border); }
        .timer.ending .timer-time { color: var(--alert); }
        .timer.ending .timer-bar > div { background: var(--alert); }
        .timer.done .timer-time { animation: timerDone 1.6s ease-in-out infinite; }

        @keyframes timerDone {
            50% { opacity: 0.45; }
        }

        .timer-more {
            font-size: calc(var(--u) * 18);
            color: var(--text-low);
        }

        /* ===== Night: dim clock + temperature, alerts and timers only ===== */
        #night-weather { display: none; }

        body.night #screen {
            grid-template-columns: minmax(0, 1fr);
        }

        body.night #side,
        body.night #clock .date,
        body.night .tag.calm,
        body.night .tag.quiet {
            display: none;
        }

        body.night #clock {
            align-items: center;
            gap: calc(var(--u) * 18);
        }

        body.night #clock .time {
            font-size: calc(var(--u) * 210);
            color: var(--night-text);
        }

        body.night #clock .period {
            font-size: calc(var(--u) * 30);
            color: #66625c;
            margin-top: calc(var(--u) * 26);
        }

        body.night #night-weather {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 14);
            font-size: calc(var(--u) * 26);
            color: var(--night-low);
            white-space: pre;
        }

        body.night #night-weather svg {
            width: calc(var(--u) * 30);
            height: calc(var(--u) * 30);
        }
    </style>
</head>
<body>
    <div id="screen">
        <div id="clock">
            <div class="date"></div>
            <div class="face">
                <div class="time"></div>
                <div class="period"></div>
            </div>
            <div id="night-weather"></div>
        </div>
        <div id="side">
            <div id="weather"></div>
            <div class="rule"></div>
            <div>
                <div class="agenda-head">Next up</div>
                <div id="agenda"></div>
            </div>
        </div>
        <div id="status">
            <div id="tags"></div>
            <div id="timers"></div>
        </div>
    </div>

    <script src="js/ha-config.js?v=20261005"></script>
    <script type="module">
        import { config } from './js/config.js?v=20261005';
        import { startScreensaver } from './js/screensaver.js?v=1';

        document.addEventListener('DOMContentLoaded', () => startScreensaver(config));
    </script>
</body>
</html>
