<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Screensaver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&family=Figtree:wght@400;500;600&display=swap">
    <style>
        /* "Quiet Hours": neutral near-black, grey-white text, one accent, sized to read
           from across the room with light strokes. Everything is sized in --u, one design pixel
           of a 1280x800 layout: the 16:10 Galaxy Tab A9+ (1920x1200). */
        :root {
            --u: min(calc(100vw / 1280), calc(100vh / 800));
            /* Neutral blacks matching the HA dashboard's Caule Black themes
               (2026-10-07: the user rejected the warm brown tint; it read as
               brown, not charcoal). Not pure black, which glows navy on the LCD. */
            --bg: #0c0c0c;
            --text-hi: #f2f2f2;
            --text: #e5e5e5;
            --text-mid: #c8c8c8;
            --text-dim: #b4b4b4;
            --text-low: #9e9e9e;
            --tag-border: #3a3a3a;
            --accent: #5fc9b4;      /* follows the season (js/ambience.js) */
            --calm: #5fc9b4;        /* "all is well" tags: always teal, so they never read as amber */
            --accent-border: #2c5a51;
            --warn: #e0a64a;
            --warn-text: #f0bd68;
            --warn-border: #6b5122;
            --alert: #ff6b5e;
            --alert-text: #ff9384;
            --alert-border: #7a3128;
            --night-text: #9a9a9a;
            --night-low: #8c8c8c;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            cursor: none;
        }

        body {
            color: var(--text);
            font-family: 'Figtree', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #screen {
            position: relative;
            width: calc(var(--u) * 1280);
            height: calc(var(--u) * 800);
            box-sizing: border-box;
            padding: calc(var(--u) * 56) calc(var(--u) * 64) calc(var(--u) * 34);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            row-gap: calc(var(--u) * 16);
            transition: transform 4s ease-in-out;
        }

        /* Left: date, clock and weather. Right: the agenda. Both centered on
           the same line. text-box trims the clock and temperature lines to
           their letters (never the agenda rows: that clips their glyphs). */
        #top {
            align-self: center;
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            column-gap: calc(var(--u) * 72);
            align-items: center;
        }

        .date, .time, .period, .wx-temp {
            text-box: trim-both cap alphabetic;
        }

        /* ===== Left column: clock + weather ===== */
        /* Each column is a left-aligned block, and the block sits centered in
           its half of the screen rather than hugging the left edge. */
        #left, #side {
            justify-self: center;
            width: fit-content;
            max-width: 100%;
        }

        #left {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #clock {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 46);
        }

        #clock .date {
            font-size: calc(var(--u) * 38);
            font-weight: 400;
            letter-spacing: 0.01em;
            color: var(--text-dim);
        }

        #clock .face {
            display: flex;
            white-space: nowrap;
            align-items: flex-start;
            gap: calc(var(--u) * 14);
        }

        #clock .time {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: calc(var(--u) * 215);   /* "12:59 PM" still fits the column */
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text-hi);
            font-variant-numeric: tabular-nums;
        }

        #clock .period {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 36);
            line-height: 1;
            color: var(--text-low);
        }

        #weather {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 18);
            margin-top: calc(var(--u) * 48);
        }

        .wx-now {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 24);
        }

        .wx-icon svg {
            display: block;
            width: calc(var(--u) * 84);
            height: calc(var(--u) * 84);
            color: var(--accent);
        }

        .wx-temp {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 120);
            line-height: 1;
            color: var(--text-hi);
        }

        .wx-cond {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 6);
        }

        .wx-label {
            font-size: calc(var(--u) * 40);
            font-weight: 500;
            color: var(--text-hi);
        }

        .wx-hilo {
            font-size: calc(var(--u) * 32);
            font-weight: 400;
            color: var(--text-dim);
            white-space: pre;
        }

        .wx-next {
            font-size: calc(var(--u) * 28);
            color: var(--text-dim);
        }

        /* ===== Insights: a few quiet, rotating lines under the weather ===== */
        /* Two lines tall at all times, so the clock above never shifts as lines come and go.
           width 0 / min-width 100%: a long line must not widen #left, or the centered block
           (and the clock with it) slides left. Long lines run right; any that would reach the
           agenda are shrunk to fit (never cut off). */
        #insights {
            width: 0;
            min-width: 100%;
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 14);
            min-height: calc(var(--u) * 87);
            margin-top: calc(var(--u) * 30);
            padding-top: calc(var(--u) * 26);
            border-top: 1.5px solid #1f1f1f;
        }
        #insights:empty, body.night #insights { display: none; }
        .ins {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
            font-size: calc(var(--u) * 29);
            line-height: 1.25;
            color: var(--text-mid);
            white-space: nowrap;
            width: max-content;    /* measured by fitInsights() in screensaver.js */
        }
        .ins.fresh { animation: insFade 2.5s ease-out both; }
        @keyframes insFade { from { opacity: 0; } to { opacity: 1; } }
        .ins svg {
            width: calc(var(--u) * 32);
            height: calc(var(--u) * 32);
            flex: none;
            color: var(--text-low);
        }
        .ins b { font-weight: 500; color: var(--text-hi); }
        .ins.nudge { color: var(--warn-text); }
        .ins.nudge svg { color: var(--warn); }
        /* ===== Right column: agenda, each time above its event ===== */
        #side {
            min-width: 0;
        }

        .agenda-head {
            font-size: calc(var(--u) * 22);
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-low);
            margin-bottom: calc(var(--u) * 26);
        }

        #agenda {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 26);
        }

        .ev-when {
            font-size: calc(var(--u) * 27);
            font-weight: 400;
            line-height: 1.25;
            color: var(--text-dim);
        }

        .ev-name {
            font-size: calc(var(--u) * 42);
            font-weight: 400;
            line-height: 1.25;
            color: var(--text-hi);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ev-none {
            font-size: calc(var(--u) * 30);
            color: var(--text-low);
        }

        /* ===== Bottom row: status tags + timers ===== */
        /* Tags then timers, centered together; a second line when they don't
           fit on one (two timers beside two tags), never drawn over each other */
        #status {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: calc(var(--u) * 16) calc(var(--u) * 24);
            min-height: calc(var(--u) * 40);
        }

        #tags:empty, #timers:empty { display: none; }

        #tags {
            justify-content: center;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: calc(var(--u) * 12) calc(var(--u) * 40);
        }

        /* One quiet line of coloured dots and words, no pill outlines
           (2026-10-08: four pills wrapped to two rows and crowded the clock) */
        .tag {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 12);
            font-size: calc(var(--u) * 25);
            font-weight: 400;
            color: var(--text);
        }

        .tag .dot {
            width: calc(var(--u) * 9);
            height: calc(var(--u) * 9);
            border-radius: 50%;
            background: #6a665f;
        }

        .tag.calm { color: var(--calm); }
        .tag.calm .dot { background: var(--calm); }
        .tag.warn { color: var(--warn-text); }
        .tag.warn .dot { background: var(--warn); }
        .tag.alert { color: var(--alert-text); }
        .tag.alert .dot { background: var(--alert); }

        #timers {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
        }

        .timer {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 22);
            padding: calc(var(--u) * 12) calc(var(--u) * 24);
            border: 2px solid var(--accent-border);
            border-radius: calc(var(--u) * 20);
        }

        .timer-meta {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 10);
            width: calc(var(--u) * 210);
        }

        .timer-name {
            font-size: calc(var(--u) * 24);
            font-weight: 400;
            color: var(--text-mid);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-bar {
            height: calc(var(--u) * 6);
            border-radius: 3px;
            background: #262626;
            overflow: hidden;
        }

        .timer-bar > div {
            height: 100%;
            margin-left: auto;   /* shrinks toward the right edge */
            background: var(--accent);
            transition: width 1s linear;
        }

        .timer-time {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 68);
            line-height: 1;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .timer.ending { border-color: var(--alert-border); }
        .timer.ending .timer-time { color: var(--alert); }
        .timer.ending .timer-bar > div { background: var(--alert); }
        .timer.done .timer-time { animation: timerDone 1.6s ease-in-out infinite; }

        @keyframes timerDone {
            50% { opacity: 0.45; }
        }

        .timer-more {
            font-size: calc(var(--u) * 24);
            color: var(--text-low);
        }

        /* ===== Night: dim clock + temperature; tags and timers as by day ===== */
        /* In a dark room even #0c0c0c glows; night goes darker still */
        body.night { --bg: #050505; }

        #night-weather { display: none; }

        body.night #top {
            grid-template-columns: minmax(0, 1fr);
        }

        body.night #side,
        body.night #weather,
        body.night #clock .date {
            display: none;
        }

        body.night #left {
            align-items: center;
            gap: calc(var(--u) * 40);
        }

        body.night #insights.homeward {
            display: flex;
            align-items: center;
            width: auto;
            max-width: 100%;
            min-height: 0;
            margin-top: 0;
            padding-top: 0;
            border-top: 0;
        }
        body.night #insights .ins { color: var(--night-low); }
        body.night #insights .ins b { color: var(--night-text); }

        body.night #clock .time {
            font-size: calc(var(--u) * 260);
            color: var(--night-text);
        }

        body.night #clock .period {
            font-size: calc(var(--u) * 40);
            color: var(--night-low);
        }

        body.night #night-weather {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
            font-size: calc(var(--u) * 40);
            font-weight: 400;
            color: var(--night-low);
            white-space: pre;
        }

        body.night #night-weather svg {
            width: calc(var(--u) * 46);
            height: calc(var(--u) * 46);
        }
    </style>
<style>
#screen{isolation:isolate}#flight-map{position:absolute;inset:0;width:100%;height:100%;z-index:-2;opacity:var(--map-opacity,.52);pointer-events:none}
#screen::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,var(--bg),transparent 25%),linear-gradient(to bottom,var(--bg),transparent 18%),linear-gradient(to right,var(--bg),transparent 15%),linear-gradient(to left,var(--bg),transparent 15%);pointer-events:none}
.live-aircraft use{fill:var(--plane,#8de0cd)}.live-aircraft text,.home text{font:14px Figtree,sans-serif;letter-spacing:1.4px;fill:var(--map-label,#85b5aa)}.live-aircraft .flight-route{font-size:11px;letter-spacing:1px;fill:var(--map-route,#71958c);opacity:.8}.home{opacity:.5}.home text{font-size:12px}.live-marker{transition:transform 2s linear}
body.night #flight-map,body.force-night #flight-map{opacity:calc(var(--map-opacity,.52)*.85)}body.night #screen::before,body.force-night #screen::before{background:linear-gradient(to top,var(--bg),transparent 25%),linear-gradient(to bottom,var(--bg),transparent 18%),linear-gradient(to right,var(--bg),transparent 15%),linear-gradient(to left,var(--bg),transparent 15%)}
body.no-labels .live-aircraft text{display:none}#map-credit{position:absolute;bottom:8px;right:14px;z-index:1;font:10px Figtree,sans-serif;color:#666;opacity:.7;pointer-events:none}#map-credit a{color:inherit;text-decoration:none}body.night #map-credit,body.force-night #map-credit{opacity:.4}
@media(prefers-reduced-motion:reduce){.live-marker{transition:none}}
/* Ambience (js/ambience.js): season accent, golden hour, weather mood, sun/moon arc */
.trail,.home circle{stroke:var(--accent)}.home .home-dot{fill:var(--accent);stroke:none}
#local-roads .road{transition:stroke 60s linear}#local-roads .minor{stroke:var(--road-minor,#343b38)}#local-roads .major{stroke:var(--road-major,#56605c)}#local-roads .water{stroke:var(--road-water,#495b57)}
#mood{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
#flight-map{transition:opacity 4s}#local-roads{transition:filter 4s}body.mood-fog #flight-map{opacity:calc(var(--map-opacity,.52)*.7)}body.mood-fog #local-roads{filter:blur(1.3px)}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.7;transition:opacity 4s}body.night #sky,body.force-night #sky{opacity:.35}
#sky .arc-track{fill:none;stroke:#8a8a8a;stroke-opacity:.22;stroke-width:1.2;stroke-dasharray:2 7;stroke-linecap:round}
#sky .arc-done{fill:none;stroke:var(--accent);stroke-opacity:.35;stroke-width:1.4}
#sky .arc-time{font:13px Figtree,sans-serif;letter-spacing:1px;fill:#8a8a8a;opacity:.7}
#sky .moon-dark{fill:#1c1c1c;stroke:#5a5a5a;stroke-width:.8}#sky .moon-lit{fill:#d8d8d8}
body.celebrate #clock .time{color:var(--celebrate);transition:color 4s}
.ins.celebrate{color:var(--text-hi)}.ins.celebrate svg,.ins.first svg{color:var(--accent)}
.ins.first.fresh svg{animation:firstGlow 3s ease-out both}@keyframes firstGlow{0%{transform:scale(.6);opacity:0}40%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}

    <div id="screen"><svg id="flight-map" viewBox="0 0 1280 800" aria-label="Local streets and nearby aircraft from Home Assistant">
<defs><radialGradient id="mapfade"><stop offset="0" stop-color="white"/><stop offset=".65" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity=".25"/></radialGradient><mask id="fade"><rect width="1280" height="800" fill="url(#mapfade)"/></mask><path id="plane" d="M0 -12 3 -3 11 2 11 5 3 3 2 10 5 12 5 14 0 12 -5 14 -5 12 -2 10 -3 3 -11 5 -11 2 -3 -3Z"/></defs>
<g id="local-roads" mask="url(#fade)"></g><g class="flights"></g><g class="home" transform="translate(640 480)"><circle r="23" fill="none" stroke="#5fc9b4" stroke-opacity=".15"/><circle class="home-dot" r="4" fill="#5fc9b4"/><text x="14" y="5">HOME</text></g></svg><div id="map-credit"><a href="https://www.openstreetmap.org/copyright" tabindex="-1">&copy; OpenStreetMap contributors</a></div>

                        <div class="period"></div>
                    </div>
                </div>
                <div id="weather"></div>
                <div id="insights"></div>
                <div id="night-weather"></div>
            </div>

            <div id="timers"></div>

<script src="js/ha-config.js?v=20261009-flight-8"></script>
<script type="module">
import { config } from './js/config.js?v=20261009-flight-8';
import { startScreensaver } from './js/screensaver.js?v=37';
import { FlightBackdrop } from './js/flight-backdrop.js?v=8';
import { Ambience } from './js/ambience.js?v=2';
// Display settings are configured by URL; the screensaver stays touchless.
const params=new URLSearchParams(location.search);
const brightness=Number(params.get('map'));
if(params.has('map') && Number.isFinite(brightness))document.documentElement.style.setProperty('--map-opacity',Math.min(100,Math.max(0,brightness))/100);
if(params.has('night'))document.body.classList.add('force-night');
if(params.get('labels')==='0')document.body.classList.add('no-labels');
const ambience=new Ambience(config).start();
startScreensaver(config,{extraLines:now=>ambience.lines(now)});
const backdrop=new FlightBackdrop(config,document.querySelector('#flight-map'));
window.flightBackdrop=backdrop;
backdrop.start();
</script></body>
