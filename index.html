<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Screensaver</title>
    <style>
        @font-face {
            font-family: 'Protest Strike';
            src: url('/fonts/ProtestStrike-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Zain';
            src: url('/fonts/Zain-Light.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Zain';
            src: url('/fonts/Zain-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Zain';
            src: url('/fonts/Zain-Extrabold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #000000;
            color: #ffffff;
            font-family: 'Protest Strike', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        #container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8vh 0;
            overflow: hidden;
        }

        #time-date-section {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            
            margin-bottom: 2vh;
        }

        #time-display {
            font-size: min(8vw, 5rem);
            margin: 0;
            text-shadow: 2px 2px 0 #333;
        }

        #date-display {
            font-size: min(4vw, 2.5rem);
            margin: 0;
            text-shadow: 2px 2px 0 #333;
        }

        #info-section {
            flex: 1;
            display: flex;
            flex-direction: row;
            width: 100%;
            gap: 2vh;
        }

        #weather-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            padding: 0 2vw;
            max-width: 50%;
				
				
        }

        #weather-display img {
            width: min(100px, 15vw);
            height: min(100px, 15vw);
            margin-top: 1vh;
            filter: drop-shadow(2px 2px 0 #333);
        }

        #calendar-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            padding: 0 2vw;
            max-width: 50%;
        }

        #calendar-header {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            font-size: min(3vw, 2rem);
            margin: 0;
            padding: 0;
        }

        #calendar-events {
            
            font-family: 'Zain', sans-serif;
            font-weight: bold;
        }

        .event {
            opacity: 0; /* Start invisible */
            flex: 0 0 100%; /* Ensure each event takes up the full width */
            transition: opacity 0.5s ease; /* Smooth fade in and out */
            text-align: center; /* Center the text within the event */
            position: absolute; /* Ensure events overlap perfectly in a single row */
            top: 0;
            left: 0;
            width: 100%; /* Ensure event spans full width */
            display: flex;
            flex-direction: column; /* Stack name and datetime vertically */
            align-items: center; /* Center items horizontally */
            justify-content: center; /* Center items vertically */
            padding: 0.3rem 0; /* Slightly adjust padding */
            box-sizing: border-box; /* Include padding in width calculations */
        }

        .event.active {
            opacity: 1; /* Fully visible */
            position: relative; /* Align the active event naturally in the row */
        }

        .event.hidden {
            opacity: 0; /* Hidden */
        }

        .event-name {
            margin-bottom: 0.5rem;
            font-family: 'Zain', sans-serif;
        }

        .event-datetime {
            color: #ffffff;
            font-style: italic;
            font-family: 'Zain', sans-serif;
        }

        /* Ticker styles */
        #sensor-ticker {
            height: min(3em, 10vh);
            line-height: min(3em, 10vh);
            
            overflow: hidden;
            white-space: nowrap;
            font-size: min(4vw, 3rem);
            color: white;
            position: relative;
            width: 100%;
            font-family: 'Zain', sans-serif;
            font-weight: 800;
        }

        #sensor-ticker .ticker-content {
            display: inline-flex;
            position: absolute;
            white-space: nowrap;
            will-change: transform;
            left: 0;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        #sensor-ticker .ticker-text {
            display: inline-block;
            padding: 0 2rem;
        }

        @keyframes tickerScroll {
            0% {
                transform: translate3d(100vw, 0, 0);
            }
            100% {
                transform: translate3d(-100%, 0, 0);
            }
        }

        #weather-display .weather-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1rem;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 0 2rem;
        }

        #weather-display .weather-info {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
        }

        #weather-display .temp {
            font-size: min(4vw, 2.5rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
        }

        #weather-display .details {
            font-size: min(2.5vw, 1.8rem);
            
        }

        #weather-display .feels-like {
            font-size: min(2vw, 1.5rem);
            
        }

        .zain-bold {
            font-family: 'Zain', sans-serif !important;
            font-weight: bold !important;
        }

        #weather-display .weather-column > div:first-child {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            order: 1;
        }

        #weather-display .weather-column img {
            order: 2;
        }

        #weather-display .weather-info {
            order: 3;
        }

        /* Update the columns layout */
        .weather-columns {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding: 0 2vw;
            box-sizing: border-box;
        }

        .weather-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3vh;
        }

        /* Current Weather Section */
        .current-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
        }

        .currently-header {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            margin-top: 0;
            padding-top: 0;
        }

        .current-weather-info {
            text-align: center;
        }

        .current-weather-icon {
            width: min(100px, 15vw);
            height: min(100px, 15vw);
            margin: 1vh 0;
            filter: drop-shadow(2px 2px 0 #333);
        }

        /* Forecast Section */
        .forecast-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
        }

        .forecast-header {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            font-size: min(3vw, 2rem);
            margin: 0;
            padding: 0;
        }

        .forecast-weather-info {
            text-align: center;
        }

        /* Everything else stays Bold */
        #weather-display, 
        #calendar-events,
        #sensor-ticker,
        .event-name,
        .event-datetime,
        .event,
        #calendar-events .event {
            font-family: 'Zain', sans-serif;
            font-weight: bold;
        }

        .weather-column > * {
            width: 100%;
            text-align: center;
        }

        .currently-header {
            order: 1;
        }

        .current-weather-info {
            order: 2;
        }

        .current-weather-icon {
            order: 3;
            width: min(100px, 15vw);
            height: min(100px, 15vw);
        }

        .forecast-header {
            order: 4;
        }

        .forecast-weather-info {
            order: 5;
        }

        /* Common header styling for both columns */
        .currently-header, #calendar-header {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            font-size: min(3vw, 2rem);
            margin: 0;
            padding: 0;
        }

        /* Weather display styling */
        #weather-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            padding: 0 2vw;
            max-width: 50%;
        }

        .current-weather-info, .forecast-weather-info {
            text-align: center;
            width: 100%;
        }

        .current-weather-info .temp {
            font-size: min(4vw, 2.5rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: 0.5vh;
        }

        .current-weather-info .details,
        .forecast-weather-info .details {
            font-size: min(2.5vw, 1.8rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: 0.5vh;
        }

        .current-weather-info .feels-like {
            font-size: min(2vw, 1.5rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: 1vh;
        }

        .forecast-header {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            font-size: min(3vw, 2rem);
            margin: 0;
            padding: 0;
        }

        .forecast-weather-info .temp {
            font-size: min(2.5vw, 1.8rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: 0.5vh;
        }

        .current-weather-icon {
            width: min(100px, 15vw);
            height: min(100px, 15vw);
            margin: 1vh 0;
        }

        /* Calendar display styling */
        #calendar-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            padding: 0 2vw;
            max-width: 50%;
				
        }

        #calendar-events {
            font-size: min(2.5vw, 1.8rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
        }

        /* Common styles for both columns */
        #weather-display, #calendar-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            padding: 0 2vw;
            max-width: 50%;
        }

        /* Headers */
        .currently-header, #calendar-header, .forecast-header {
            font-family: 'Zain', sans-serif;
            font-weight: 800;
            text-decoration: underline;
            font-size: min(3vw, 2rem);
            margin: 0;
            padding: 0;
            margin-bottom: 1vh;
            color: #ffffff;
            text-shadow: 2px 2px 0 #333;
        }

        /* Content text - all same size except current temp */
        .current-weather-info .details,
        .current-weather-info .feels-like,
        .forecast-weather-info .details,
        .forecast-weather-info .temp,
        #calendar-events,
        .event-name,
        .event-datetime {
            font-size: min(2.5vw, 1.8rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: 0.5vh;
            color: #ffffff;
            text-shadow: 2px 2px 0 #333;
        }

        /* Current temperature only - larger size */
        .current-weather-info .temp {
            font-size: min(4vw, 2.5rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: 0.5vh;
            color: #ffffff;
            text-shadow: 2px 2px 0 #333;
        }

        /* Weather icon */
        .current-weather-icon {
            width: min(100px, 15vw);
            height: min(100px, 15vw);
            margin: 1vh 0;
        }

        /* Event spacing */
        .event {
            margin-bottom: 1vh;
        }

        /* Ensure all text containers are fully opaque */
        .current-weather-info,
        .forecast-weather-info,
        #calendar-events,
        .event {
            opacity: 1;
        }

        /* Current temperature and event name - larger size */
        .current-weather-info .temp,
        .event-name {
            font-size: min(4vw, 2.5rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: 0.5vh;
            color: #ffffff;
        }

        /* All other content text - standard size */
        .current-weather-info .details,
        .current-weather-info .feels-like,
        .forecast-weather-info .details,
        .forecast-weather-info .temp,
        #calendar-events,
        .event-datetime {
            font-size: min(2.5vw, 1.8rem);
            font-family: 'Zain', sans-serif;
            font-weight: bold;
            margin-bottom: 0.5vh;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="time-date-section">
            <div id="date-display"></div>
            <div id="time-display"></div>
        </div>
        <div id="info-section">
            <div id="weather-display">Loading weather...</div>
            <div id="calendar-display">
                <div id="calendar-header">Upcoming Events</div>
                <div id="calendar-events"></div>
            </div>
        </div>
    </div>
    <div id="sensor-ticker"><div class="ticker-content"></div></div>

    <script type="module">
        import { config } from './js/config.js';
        import { WeatherDisplay } from './js/weather.js';
        import { CalendarDisplay } from './js/calendar.js';
        import { Clock } from './js/clock.js';
        import { Ticker } from './js/ticker.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize clock
            const clock = new Clock(
                document.getElementById('time-display'),
                document.getElementById('date-display')
            );
            clock.start();

            // Initialize weather
            const weatherDisplay = new WeatherDisplay(
                config.weatherApiKey, 
                document.getElementById('weather-display')
            );
            weatherDisplay.start();

            // Initialize calendar
            const calendarDisplay = new CalendarDisplay(
                config.haUrl,
                config.longLivedAccessToken,
                document.getElementById('calendar-events')
            );
            calendarDisplay.start();

            // Initialize ticker
            const ticker = new Ticker(
                config.haUrl,
                config.longLivedAccessToken,
                document.getElementById('sensor-ticker')
            );
            ticker.start();
        });
    </script>
</body>
</html>
