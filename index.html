<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Screensaver</title>
    <style>
        @font-face {
            font-family: 'Protest Strike';
            src: url('/fonts/ProtestStrike-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(270deg, #0f2027, #203a43, #2c5364, #1b263b, #141e30, #243b55);
            background-size: 1400% 1400%;
            animation: gradientBG 60s ease infinite;
            color: #ffffff;
            font-family: 'Protest Strike', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8vh 0;
            overflow: hidden;
        }

        #time-date-section {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            
            margin-bottom: 2vh;
        }

        #time-display {
            font-size: min(8vw, 5rem);
            margin: 0;
        }

        #date-display {
            font-size: min(4vw, 2.5rem);
            margin: 0;
        }

        #info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 2vh;
        }

        #weather-display {
            flex: 1;
            font-size: min(3vw, 2rem);
            padding: 1vh 0;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #weather-display img {
            width: min(100px, 15vw);
            height: min(100px, 15vw);
        }

        #calendar-display {
            flex: 1;
            font-size: min(2.5vw, 1.8rem);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 1.0rem; /* Increased spacing between elements */
        }

        #calendar-header {
            font-size: min(3vw, 2rem);
            margin: 0;
            padding-bottom: 0.5rem; /* Space between header and events */
            text-align: center;
        }

        #calendar-events {
            margin-top: 0; /* Ensure no top margin is added by default */
            padding-top: 0; /* Ensure no extra padding is applied */
            display: flex; /* Align events horizontally */
            height: auto; /* Allow height to adjust based on content */
            overflow: hidden; /* Prevent non-active events from showing */
            justify-content: center; /* Center the event horizontally */
            align-items: center; /* Center the event vertically */
            width: 100%; /* Ensure it spans the full width of the page */
            position: relative; /* Ensure absolute positioning of child events works correctly */
        }

        .event {
            opacity: 0; /* Start invisible */
            flex: 0 0 100%; /* Ensure each event takes up the full width */
            transition: opacity 0.5s ease; /* Smooth fade in and out */
            text-align: center; /* Center the text within the event */
            position: absolute; /* Ensure events overlap perfectly in a single row */
            top: 0;
            left: 0;
            width: 100%; /* Ensure event spans full width */
            display: flex;
            flex-direction: column; /* Stack name and datetime vertically */
            align-items: center; /* Center items horizontally */
            justify-content: center; /* Center items vertically */
            padding: 0.3rem 0; /* Slightly adjust padding */
            box-sizing: border-box; /* Include padding in width calculations */
        }

        .event.active {
            opacity: 1; /* Fully visible */
            position: relative; /* Align the active event naturally in the row */
        }

        .event.hidden {
            opacity: 0; /* Hidden */
        }

        .event-name {
            font-weight: bold;
            margin-bottom: 0.5rem; /* Space between name and datetime */
        }

        .event-datetime {
            color: #ffffff; /* Ensure date/time is visible against background */
            /* Adjust font size if necessary */
        }

        /* Ticker styles */
        #sensor-ticker {
            height: min(3em, 10vh);
            line-height: min(3em, 10vh);
            background-color: rgba(0, 0, 0, 0.7);
            overflow: hidden;
            white-space: nowrap;
            font-size: min(2.5vw, 1.8rem);
            color: white;
            position: relative;
            width: 100%;
        }

        #sensor-ticker .ticker-content {
            display: inline-block;
            padding: 0 2rem;
            position: absolute;
            white-space: nowrap;
            will-change: transform;
            transform: translateX(100vw);
        }

        @keyframes tickerScroll {
            from {
                transform: translateX(100vw);
            }
            to {
                transform: translateX(-500%);
            }
        }

        #weather-display .weather-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1rem;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 0 2rem;
        }

        #weather-display .weather-info {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
        }

        #weather-display .temp {
            font-size: min(4vw, 2.5rem);
        }

        #weather-display .details {
            font-size: min(2.5vw, 1.8rem);
            opacity: 0.9;
        }

        #weather-display .feels-like {
            font-size: min(2vw, 1.5rem);
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="time-date-section">
            <div id="time-display"></div>
            <div id="date-display"></div>
        </div>
        <div id="info-section">
            <div id="weather-display">Loading weather...</div>
            <div id="calendar-display">
                <div id="calendar-header">Upcoming Events</div>
                <div id="calendar-events"></div>
            </div>
        </div>
    </div>
    <div id="sensor-ticker"><div class="ticker-content">Loading waste collection data...</div></div>

    <script type="module">
        import { config } from './js/config.js';
        import { WeatherDisplay } from './js/weather.js';
        import { CalendarDisplay } from './js/calendar.js';
        import { Clock } from './js/clock.js';
        import { Ticker } from './js/ticker.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize clock
            const clock = new Clock(
                document.getElementById('time-display'),
                document.getElementById('date-display')
            );
            clock.start();

            // Initialize weather
            const weatherDisplay = new WeatherDisplay(
                config.weatherApiKey, 
                document.getElementById('weather-display')
            );
            weatherDisplay.start();

            // Initialize calendar
            const calendarDisplay = new CalendarDisplay(
                config.haUrl,
                config.longLivedAccessToken,
                document.getElementById('calendar-events')
            );
            calendarDisplay.start();

            // Initialize ticker
            const ticker = new Ticker(
                config.haUrl,
                config.longLivedAccessToken,
                document.getElementById('sensor-ticker')
            );
            ticker.start();
        });
    </script>
</body>
</html>
