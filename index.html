<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Screensaver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300&family=Figtree:wght@400;500;600&display=swap">
    <style>
        /* "Quiet Hours": neutral near-black, grey-white text, one accent, sized to read
           from across the room with light strokes. Everything is sized in --u, one design pixel
           of a 1280x800 layout: the 16:10 Galaxy Tab A9+ (1920x1200). */
        :root {
            --u: min(calc(100vw / 1280), calc(100vh / 800));
            /* Neutral blacks matching the HA dashboard's Caule Black themes
               (2026-10-07: the user rejected the warm brown tint; it read as
               brown, not charcoal). Not pure black, which glows navy on the LCD. */
            --bg: #0c0c0c;
            --text-hi: #f2f2f2;
            --text: #e5e5e5;
            --text-mid: #c8c8c8;
            --text-dim: #b4b4b4;
            --text-low: #9e9e9e;
            --tag-border: #3a3a3a;
            --accent: #5fc9b4;      /* follows the season (js/ambience.js) */
            --calm: #5fc9b4;        /* "all is well" tags: always teal, so they never read as amber */
            --accent-border: #2c5a51;
            --warn: #e0a64a;
            --warn-text: #f0bd68;
            --warn-border: #6b5122;
            --alert: #ff6b5e;
            --alert-text: #ff9384;
            --alert-border: #7a3128;
            --night-text: #9a9a9a;
            --night-low: #8c8c8c;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            cursor: none;
        }

        body {
            color: var(--text);
            font-family: 'Figtree', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #screen {
            position: relative;
            width: calc(var(--u) * 1280);
            height: calc(var(--u) * 800);
            box-sizing: border-box;
            padding: calc(var(--u) * 56) calc(var(--u) * 64) calc(var(--u) * 34);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            row-gap: calc(var(--u) * 16);
            transition: transform 4s ease-in-out;
        }

        /* Left: date, clock and weather. Right: the agenda. Both centered on
           the same line. text-box trims the clock and temperature lines to
           their letters (never the agenda rows: that clips their glyphs). */
        #top {
            align-self: center;
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
            column-gap: calc(var(--u) * 72);
            align-items: center;
        }

        .date, .time, .period, .wx-temp {
            text-box: trim-both cap alphabetic;
        }

        /* ===== Left column: clock + weather ===== */
        /* Each column is a left-aligned block, and the block sits centered in
           its half of the screen rather than hugging the left edge. */
        #left, #side {
            justify-self: center;
            width: fit-content;
            max-width: 100%;
        }

        #left {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #clock {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 46);
        }

        #clock .date {
            font-size: calc(var(--u) * 38);
            font-weight: 400;
            letter-spacing: 0.01em;
            color: var(--text-dim);
        }

        #clock .face {
            display: flex;
            white-space: nowrap;
            align-items: flex-start;
            gap: calc(var(--u) * 14);
        }

        #clock .time {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: calc(var(--u) * 215);   /* "12:59 PM" still fits the column */
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text-hi);
            font-variant-numeric: tabular-nums;
        }

        #clock .period {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 36);
            line-height: 1;
            color: var(--text-low);
        }

        #weather {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 18);
            margin-top: calc(var(--u) * 48);
        }

        .wx-now {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 24);
        }

        .wx-icon svg {
            display: block;
            width: calc(var(--u) * 84);
            height: calc(var(--u) * 84);
            color: var(--accent);
        }

        .wx-temp {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 120);
            line-height: 1;
            color: var(--text-hi);
        }

        .wx-cond {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 6);
        }

        .wx-label {
            font-size: calc(var(--u) * 40);
            font-weight: 500;
            color: var(--text-hi);
        }

        .wx-hilo {
            font-size: calc(var(--u) * 32);
            font-weight: 400;
            color: var(--text-dim);
            white-space: pre;
        }

        .wx-next {
            font-size: calc(var(--u) * 28);
            color: var(--text-dim);
        }

        /* ===== Insights: a few quiet, rotating lines under the weather ===== */
        /* Two lines tall at all times, so the clock above never shifts as lines come and go.
           width 0 / min-width 100%: a long line must not widen #left, or the centered block
           (and the clock with it) slides left. Long lines run right; any that would reach the
           agenda are shrunk to fit (never cut off). */
        #insights {
            width: 0;
            min-width: 100%;
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 14);
            min-height: calc(var(--u) * 87);
            margin-top: calc(var(--u) * 30);
            padding-top: calc(var(--u) * 26);
        }
        #insights:empty, body.night #insights { display: none; }
        .ins {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
            font-size: calc(var(--u) * 29);
            line-height: 1.25;
            color: var(--text-mid);
            white-space: nowrap;
            width: max-content;    /* measured by fitInsights() in screensaver.js */
        }
        /* The rotating lines, below any pinned ones. They scroll in and out
           (Insights.scroll): clip at this box's top and bottom only, so they pass behind
           the pinned lines and long lines still run right. */
        .ins-roll {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 14);
            /* Leaving lines get to slide into the gap under a pinned line (or, with
               none pinned, up to the top of the box) before they vanish, so they glide out. */
            clip-path: inset(calc(var(--u) * -14) -100vw 0 -100vw);
        }
        .ins-roll:first-child { clip-path: inset(calc(var(--u) * -26) -100vw 0 -100vw); }
        .ins.leaving { position: absolute; }
        .ins svg {
            width: calc(var(--u) * 32);
            height: calc(var(--u) * 32);
            flex: none;
            color: var(--text-low);
        }
        .ins b { font-weight: 500; color: var(--text-hi); }
        .ins.nudge { color: var(--warn-text); }
        .ins.nudge svg { color: var(--warn); }
        /* ===== Right column: agenda, each time above its event ===== */
        #side {
            min-width: 0;
        }

        .agenda-head {
            font-size: calc(var(--u) * 22);
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-low);
            margin-bottom: calc(var(--u) * 26);
        }

        #agenda {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 26);
        }

        .ev-when {
            font-size: calc(var(--u) * 27);
            font-weight: 400;
            line-height: 1.25;
            color: var(--text-dim);
        }

        .ev-name {
            font-size: calc(var(--u) * 42);
            font-weight: 400;
            line-height: 1.25;
            color: var(--text-hi);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ev-none {
            font-size: calc(var(--u) * 30);
            color: var(--text-low);
        }

        /* ===== Bottom row: status tags + timers ===== */
        /* Tags then timers, centered together; a second line when they don't
           fit on one (two timers beside two tags), never drawn over each other */
        #status {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: calc(var(--u) * 16) calc(var(--u) * 24);
            min-height: calc(var(--u) * 40);
        }

        #tags:empty, #timers:empty { display: none; }

        #tags {
            justify-content: center;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: calc(var(--u) * 12) calc(var(--u) * 40);
        }

        /* One quiet line of coloured dots and words, no pill outlines
           (2026-10-08: four pills wrapped to two rows and crowded the clock) */
        .tag {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 12);
            font-size: calc(var(--u) * 25);
            font-weight: 400;
            color: var(--text);
        }

        .tag .dot {
            width: calc(var(--u) * 9);
            height: calc(var(--u) * 9);
            border-radius: 50%;
            background: #6a665f;
        }

        .tag.calm { color: var(--calm); }
        .tag.calm .dot { background: var(--calm); }
        .tag.warn { color: var(--warn-text); }
        .tag.warn .dot { background: var(--warn); }
        .tag.alert { color: var(--alert-text); }
        .tag.alert .dot { background: var(--alert); }

        #timers {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
        }

        .timer {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 22);
            padding: calc(var(--u) * 12) calc(var(--u) * 24);
            border: 2px solid var(--accent-border);
            border-radius: calc(var(--u) * 20);
        }

        .timer-meta {
            display: flex;
            flex-direction: column;
            gap: calc(var(--u) * 10);
            width: calc(var(--u) * 210);
        }

        .timer-name {
            font-size: calc(var(--u) * 24);
            font-weight: 400;
            color: var(--text-mid);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timer-bar {
            height: calc(var(--u) * 6);
            border-radius: 3px;
            background: #262626;
            overflow: hidden;
        }

        .timer-bar > div {
            height: 100%;
            margin-left: auto;   /* shrinks toward the right edge */
            background: var(--accent);
            transition: width 1s linear;
        }

        .timer-time {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: calc(var(--u) * 68);
            line-height: 1;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .timer.ending { border-color: var(--alert-border); }
        .timer.ending .timer-time { color: var(--alert); }
        .timer.ending .timer-bar > div { background: var(--alert); }
        .timer.done .timer-time { animation: timerDone 1.6s ease-in-out infinite; }

        @keyframes timerDone {
            50% { opacity: 0.45; }
        }

        .timer-more {
            font-size: calc(var(--u) * 24);
            color: var(--text-low);
        }

        /* ===== Night: dim clock + temperature; tags and timers as by day ===== */
        /* In a dark room even #0c0c0c glows; night goes darker still */
        body.night { --bg: #050505; }

        #night-weather { display: none; }

        body.night #top {
            grid-template-columns: minmax(0, 1fr);
        }

        body.night #side,
        body.night #weather,
        body.night #clock .date {
            display: none;
        }

        body.night #left {
            align-items: center;
            gap: calc(var(--u) * 40);
        }

        body.night #insights.homeward {
            display: flex;
            align-items: center;
            width: auto;
            max-width: 100%;
            min-height: 0;
            margin-top: 0;
            padding-top: 0;
            border-top: 0;
        }
        body.night #insights .ins { color: var(--night-low); }
        body.night #insights .ins b { color: var(--night-text); }

        body.night #clock .time {
            font-size: calc(var(--u) * 260);
            color: var(--night-text);
        }

        body.night #clock .period {
            font-size: calc(var(--u) * 40);
            color: var(--night-low);
        }

        body.night #night-weather {
            display: flex;
            align-items: center;
            gap: calc(var(--u) * 16);
            font-size: calc(var(--u) * 40);
            font-weight: 400;
            color: var(--night-low);
            white-space: pre;
        }

        body.night #night-weather svg {
            width: calc(var(--u) * 46);
            height: calc(var(--u) * 46);
        }
        /* ===== Touch mode (?touch=1): month calendar (js/month-calendar.js) ===== */
        body.touch, body.touch * { -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        #month { display: none; }
        body.month-open #top { display: none; }
        body.month-open #month {
            grid-row: 1;
            display: grid;
            /* The day panel shares the grid's row, so its top lines up with the grid's top rule */
            grid-template-columns: minmax(0, 1fr) calc(var(--u) * 300);
            grid-template-rows: auto auto minmax(0, 1fr);
            grid-template-areas: "head head" "dow ." "grid side";
            column-gap: calc(var(--u) * 36);
            min-height: 0;
        }
        .mc-head { grid-area: head; margin-bottom: calc(var(--u) * 14); }
        .mc-dows { grid-area: dow; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .mc-grid { grid-area: grid; }
        .mc-side { grid-area: side; }
        #month button {
            font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: none;
        }
        .mc-head { display: flex; align-items: center; gap: calc(var(--u) * 18); }
        .mc-title {
            font-family: 'Outfit', sans-serif; font-weight: 200; font-size: calc(var(--u) * 54);
            line-height: 1; color: var(--text-hi); min-width: calc(var(--u) * 400);
        }
        .mc-head .mc-title { order: 0; }
        .mc-head [data-act="prev"] { order: 1; }
        .mc-head [data-act="next"] { order: 2; }
        .mc-head .mc-pill { order: 3; }
        #month .mc-btn {
            width: calc(var(--u) * 58); height: calc(var(--u) * 58); border-radius: 50%;
            border: 1px solid var(--tag-border); background: rgba(12, 12, 12, .6);
            font-size: calc(var(--u) * 40); line-height: 1; color: var(--text-mid);
            display: flex; align-items: center; justify-content: center; padding-bottom: calc(var(--u) * 5);
        }
        #month .mc-pill {
            height: calc(var(--u) * 58); padding: 0 calc(var(--u) * 24); border-radius: calc(var(--u) * 29);
            border: 1px solid var(--accent-border); background: rgba(12, 12, 12, .6);
            font-size: calc(var(--u) * 22); color: var(--accent);
        }
        .mc-grid {
            min-height: 0; display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            grid-template-rows: repeat(6, minmax(0, 1fr));
            gap: 0;
        }
        .mc-dow {
            font-size: calc(var(--u) * 17); font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
            color: var(--text-low); padding: 0 calc(var(--u) * 10) calc(var(--u) * 4);
        }
        .mc-day {
            min-width: 0; min-height: 0; overflow: hidden; box-sizing: border-box;
            padding: calc(var(--u) * 7) calc(var(--u) * 9);
            /* Gridlines: every day draws its right and bottom rule; the first column and the
               first week add the outer left and top ones. */
            border-right: 1px solid var(--mc-line); border-bottom: 1px solid var(--mc-line);
            background: rgba(12, 12, 12, .8);
            display: flex; flex-direction: column; gap: calc(var(--u) * 3);
        }
        .mc-day.other { background: rgba(12, 12, 12, .55); }
        body.month-open #flight-map, body.month-open #rain-radar { opacity: .35; }
        .mc-day.other > * { opacity: .45; }
        .mc-day.past:not(.today) .mc-num { color: var(--text-low); }
        #month { --mc-line: #4a4a4a; }
        .mc-day:nth-child(7n+1) { border-left: 1px solid var(--mc-line); }
        .mc-day:nth-child(-n+7) { border-top: 1px solid var(--mc-line); }
        .mc-day.sel { box-shadow: inset 0 0 0 calc(var(--u) * 2) var(--accent); background: rgba(40, 40, 40, .72); }
        .mc-top { display: flex; align-items: center; justify-content: space-between; flex: none; height: calc(var(--u) * 28); }
        .mc-num {
            font-size: calc(var(--u) * 20); font-weight: 500; color: var(--text-mid);
            line-height: calc(var(--u) * 28); height: calc(var(--u) * 28); flex: none;
        }
        .mc-bins { display: flex; gap: calc(var(--u) * 4); }
        .mc-icon { width: calc(var(--u) * 19); height: calc(var(--u) * 19); display: block; color: var(--text-dim); }
        .mc-icon.recycling { color: var(--calm); }
        .mc-icon.big { width: calc(var(--u) * 26); height: calc(var(--u) * 26); }
        .mc-pick { display: inline-flex; align-items: center; gap: calc(var(--u) * 8); margin-right: calc(var(--u) * 18); }
        .mc-hol {
            font-size: calc(var(--u) * 16); line-height: 1.3; color: var(--accent); font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none;
        }
        .mc-item.hol { border-left-color: var(--accent); }
        .mc-item.hol .mc-what { color: var(--accent); }
        .mc-item.bins { border-left-color: var(--calm); }
        .mc-day.today .mc-num {
            min-width: calc(var(--u) * 28); text-align: center; border-radius: calc(var(--u) * 14);
            background: var(--accent); color: #0c0c0c; font-weight: 600;
        }
        .mc-ev, .mc-more {
            font-size: calc(var(--u) * 16); line-height: 1.3; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none;
        }
        .mc-ev { border-left: calc(var(--u) * 3) solid var(--text-low); padding-left: calc(var(--u) * 6); }
        .mc-ev.liam { border-left-color: var(--accent); }
        .mc-more { color: var(--text-low); padding-left: calc(var(--u) * 9); }
        .mc-side {
            min-height: 0; display: flex; flex-direction: column; box-sizing: border-box;
            padding: calc(var(--u) * 22) calc(var(--u) * 24) calc(var(--u) * 20);
            border: 1px solid var(--mc-line); background: rgba(12, 12, 12, .8);
        }
        .mc-side-title { font-family: 'Outfit', sans-serif; font-weight: 300; font-size: calc(var(--u) * 44); line-height: 1.1; color: var(--text-hi); }
        .mc-side-date { font-size: calc(var(--u) * 24); color: var(--text-dim); margin-top: calc(var(--u) * 6); }
        .mc-list {
            flex: 1; min-height: 0; overflow-y: auto; margin-top: calc(var(--u) * 26);
            display: flex; flex-direction: column; gap: calc(var(--u) * 20); touch-action: pan-y;
        }
        .mc-item { border-left: calc(var(--u) * 3) solid var(--text-low); padding-left: calc(var(--u) * 14); }
        .mc-item.liam { border-left-color: var(--accent); }
        .mc-when { font-size: calc(var(--u) * 20); color: var(--text-dim); line-height: 1.3; }
        .mc-what { font-size: calc(var(--u) * 27); color: var(--text-hi); line-height: 1.25; }
        .mc-none { font-size: calc(var(--u) * 24); color: var(--text-low); }
        /* ===== Touch mode: weather view (js/weather-view.js) ===== */
        #wx { display: none; --wv-rain: #7fb2d9; }
        body.weather-open #top { display: none; }
        body.weather-open #wx {
            grid-row: 1; display: grid; min-height: 0;
            grid-template-columns: minmax(0, 1fr) calc(var(--u) * 440);
            grid-template-rows: auto minmax(0, 1fr);
            grid-template-areas: "now days" "hours days";
            gap: calc(var(--u) * 22) calc(var(--u) * 36);
        }
        /* The map shows the weather: radar and wind forward, traffic faded */
        body.weather-open #flight-map :is(.flights, .vessels, .trains, .road-traffic, .family, .commutes) { opacity: .12; }
        body.weather-open #rain-radar { opacity: .85; }
        body.weather-open #flight-map .wind { opacity: .9; }
        #wx button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: none; }
        .wv-loading { grid-area: now; font-size: calc(var(--u) * 28); color: var(--text-low); }
        .wv-now, .wv-hours, .wv-days {
            min-height: 0; box-sizing: border-box; border: 1px solid var(--mc-line, #4a4a4a); background: rgba(12, 12, 12, .8);
        }
        #wx { --mc-line: #4a4a4a; }
        .wv-now { grid-area: now; padding: calc(var(--u) * 20) calc(var(--u) * 26); display: flex; flex-direction: column; gap: calc(var(--u) * 18); }
        .wv-main { display: flex; align-items: center; gap: calc(var(--u) * 20); }
        .wv-icon svg { display: block; width: calc(var(--u) * 78); height: calc(var(--u) * 78); color: var(--accent); }
        .wv-temp { font-family: 'Outfit', sans-serif; font-weight: 300; font-size: calc(var(--u) * 96); line-height: 1; color: var(--text-hi); }
        .wv-label { font-size: calc(var(--u) * 34); font-weight: 500; color: var(--text-hi); }
        .wv-hilo { font-size: calc(var(--u) * 26); color: var(--text-dim); margin-top: calc(var(--u) * 4); }
        .wv-stats { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 10) calc(var(--u) * 30); }
        .wv-k { font-size: calc(var(--u) * 15); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--text-low); }

<script src="js/ha-config.js?v=20261009-flight-8"></script>
<script type="module">
import { config } from './js/config.js?v=20261009-flight-8';
import { startScreensaver } from './js/screensaver.js?v=54';
import { startTouchMode } from './js/month-calendar.js?v=6';
import { FlightBackdrop } from './js/flight-backdrop.js?v=42';
import { VesselLayer, VESSEL_ENTITY } from './js/vessel-layer.js?v=20';
import { TrainLayer, TRAIN_ENTITY } from './js/train-layer.js?v=12';
import { RoadTrafficLayer, ROAD_TRAFFIC_ENTITY } from './js/road-traffic.js?v=6';
import { FamilyLayer, FAMILY } from './js/family-layer.js?v=3';
import { WindLayer, WIND_ENTITY } from './js/wind-layer.js?v=3';
import { CommuteLayer, COMMUTE_ENTITIES } from './js/commute-layer.js?v=2';
import { startMapLayers } from './js/map-layers.js?v=6';
import { RainRadar } from './js/rain-radar.js?v=4';
import { Ambience } from './js/ambience.js?v=16';
// Display settings are configured by URL. The screensaver is touchless unless ?touch=1
// (Fully main browser, not its screensaver overlay): agenda = month calendar, elsewhere = dashboard.
const params=new URLSearchParams(location.search);
const brightness=Number(params.get('map'));
if(params.has('map') && Number.isFinite(brightness))document.documentElement.style.setProperty('--map-opacity',Math.min(100,Math.max(0,brightness))/100);
if(params.has('night'))document.body.classList.add('force-night');
if(params.get('labels')==='0')document.body.classList.add('no-labels');
startMapLayers(config);
const ambience=new Ambience(config).start();
startScreensaver(config,{extraLines:now=>ambience.lines(now)});
if(params.get('touch')==='1'){
    const {cal,wx}=startTouchMode(config,params.get('home')||config.haUrl);
    if(params.get('view')==='weather')wx.open();
    if(params.get('view')==='month')cal.open(params.has('day')?new Date(params.get('day')+'T12:00:00'):new Date());
}
const flightMap=document.querySelector('#flight-map');
const backdrop=new FlightBackdrop(config,flightMap,null,document.querySelector('#flight-tally'),
    {layer:new VesselLayer(flightMap.querySelector('.vessels')),entity:VESSEL_ENTITY},
    {layer:new TrainLayer(flightMap.querySelector('.trains')),entity:TRAIN_ENTITY},
    {layer:new RoadTrafficLayer(flightMap.querySelector('.road-traffic')),entity:ROAD_TRAFFIC_ENTITY},
    {family:{layer:new FamilyLayer(flightMap.querySelector('.family')),entities:FAMILY},
     wind:{layer:new WindLayer(flightMap.querySelector('.wind')),entity:WIND_ENTITY,maxAge:3*3600e3},
     commute:{layer:new CommuteLayer(flightMap.querySelector('.commutes')),entities:COMMUTE_ENTITIES}});
window.flightBackdrop=backdrop;
new RainRadar(document.getElementById('rain-radar'),()=>backdrop.box).start();
backdrop.start();
</script></body>
</html>
